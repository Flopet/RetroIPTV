<!DOCTYPE html>
<!--
  ui/index.html — the RENDERER (the visible web page).

  Structure mirrors a real TV set:
    .tv                         the plastic cabinet (bezel)
      .screen                   the 4:3 picture tube (everything inside is stacked)
        <video>                 the actual video (bottom layer)
        canvas.snow             animated static "snow" (shown while tuning / no signal)
        .crt                    scanlines + vignette overlay (pure CSS)
        .osd                    on-screen display text (banner, NO SIGNAL, volume, etc.)
      .controls                 the front-panel buttons
      .badge                    the moulded logo

  Three scripts load at the bottom, in order:
    mpegts.js   — the one runtime dependency; plays live MPEG-TS streams
    epg.js      — parses the XMLTV guide (defines buildGuide())
    renderer.js — the app logic; wires everything together
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Content-Security-Policy: silences Electron's insecure-CSP warning and limits
    what the page may load. We allow:
      • scripts/workers from our own files + blob: (mpegts.js spins up a worker)
      • media + network from http/https/blob: (the actual TS/MP4 streams)
      • inline styles ('unsafe-inline') because renderer.js sets a few CSS vars.
    CSP Documentation: https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' blob:;
    worker-src 'self' blob:;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: http: https:;
    media-src 'self' blob: data: http: https:;
    connect-src 'self' http: https:;
  " />
  <title>RetroIPTV</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="tv">
    <div class="screen">
      <video id="video"></video>
      <canvas id="snow" class="snow"></canvas>
      <div class="crt"></div>
      <div class="osd">
        <div id="banner" class="banner">
          <div id="banner-title" class="banner-title"></div>
          <div id="banner-sub" class="banner-sub"></div>
        </div>
        <div id="nosignal" class="nosignal">NO SIGNAL</div>
        <div id="entry" class="entry"></div>
        <div id="volume" class="volume">
          <span id="vol-label" class="vol-label">VOL</span>
          <div class="vol-track"><div id="vol-fill" class="vol-fill"></div></div>
        </div>
        <div id="mute" class="mute">🔇 MUTE</div>
        <div id="channel" class="channel">
          <span class="seg-ghost">88</span>
          <span id="channel-digits" class="seg-digits"></span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button data-act="chdn">CH ▼</button>
      <button data-act="chup">CH ▲</button>
      <button data-act="voldn">VOL −</button>
      <button data-act="volup">VOL +</button>
      <button data-act="power" class="power">⏻</button>
    </div>

    <div class="badge">RIPTV</div>
  </div>

  <!-- ../../node_modules because this file is two levels deep (src/ui/). -->
  <script src="../../node_modules/mpegts.js/dist/mpegts.js"></script>
  <script src="epg.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
